[package]
name = "metagrid"
version = "1.0.1"
description = "Metagrid Dota 2 Hero Layout Manager"
authors = ["maybewewill"]
edition = "2021"

[lib]
name = "metagrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-mcp-bridge = "0.12"
sysinfo = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
directories = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
regex = "1"
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

