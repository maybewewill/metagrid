name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            asset_pattern: target/release/bundle/nsis/*.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            rust_targets: i686-pc-windows-msvc
            asset_pattern: target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            asset_pattern: target/release/bundle/appimage/*.AppImage,target/release/bundle/deb/*.deb,target/release/bundle/pacman/*.pkg.tar.zst
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset_pattern: target/universal-apple-darwin/release/bundle/dmg/*.dmg,target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2 \
            zstd

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Application
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] || [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            npm run tauri build
          else
            npm run tauri build -- --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Build Arch Linux Pacman package (.pkg.tar.zst)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION=${VERSION:-1.3.1}
          PKG_DIR="target/release/bundle/pacman/pkg"
          mkdir -p "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/icons/hicolor/128x128/apps" "$PKG_DIR/usr/share/icons/hicolor/32x32/apps"
          
          cp target/release/metagrid "$PKG_DIR/usr/bin/metagrid"
          chmod 755 "$PKG_DIR/usr/bin/metagrid"
          cp aur/metagrid/metagrid.desktop "$PKG_DIR/usr/share/applications/metagrid.desktop"
          cp src-tauri/icons/128x128.png "$PKG_DIR/usr/share/icons/hicolor/128x128/apps/metagrid.png"
          cp src-tauri/icons/32x32.png "$PKG_DIR/usr/share/icons/hicolor/32x32/apps/metagrid.png"
          
          cat <<EOF > "$PKG_DIR/.PKGINFO"
          pkgname = metagrid
          pkgver = ${VERSION}-1
          pkgdesc = Automatic Dota 2 Meta Hero Grid Layout Manager synced with Dota2ProTracker
          url = https://github.com/maybewewill/metagrid
          builddate = $(date +%s)
          packager = maybewewill
          size = $(du -sb "$PKG_DIR" | awk '{print $1}')
          arch = x86_64
          license = MIT
          depend = gtk3
          depend = webkit2gtk-4.1
          depend = libayatana-appindicator
          depend = openssl
          depend = curl
          EOF

          cd "$PKG_DIR"
          tar --zstd -cf "../metagrid-${VERSION}-1-x86_64.pkg.tar.zst" .PKGINFO usr
          cp "../metagrid-${VERSION}-1-x86_64.pkg.tar.zst" "../metagrid-x86_64.pkg.tar.zst"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
